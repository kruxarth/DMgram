name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dmgram-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/dmgram-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Test and build the release APK
        run: ./gradlew test assembleRelease

      - name: Name the APK and write its SHA-256
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "DMGram-v${version}.apk"
          sha256sum "DMGram-v${version}.apk" > "DMGram-v${version}.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            DMGram-v*.apk
            DMGram-v*.sha256
