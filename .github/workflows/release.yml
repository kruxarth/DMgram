name: release

on:
  push:
    tags:
      - "v*"

# Nothing by default; the job below asks for what it needs.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Third-party actions are pinned to commit SHAs: a moved tag can't change what runs next to the keystore.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dmgram-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/dmgram-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Test and build the release APK
        run: ./gradlew test assembleRelease

      - name: Delete the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/dmgram-release.jks" keystore.properties

      - name: Name the APK and write its SHA-256
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "DMGram-v${version}.apk"
          sha256sum "DMGram-v${version}.apk" > "DMGram-v${version}.sha256"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            DMGram-v*.apk
            DMGram-v*.sha256
